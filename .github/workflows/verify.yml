name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python verify_models.py results/zero_model_laws.json
      - run: python verify_models.py --selftest results/zero_model_laws.json
      - run: python infinite_models.py
      - name: z3 lemma chain (z3 results vary between runs, informational only)
        continue-on-error: true
        run: python lemma_chain_f_x_yz.py
